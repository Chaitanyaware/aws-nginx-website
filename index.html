
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS DevOps Project</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            text-align: center;
        }

        header {
            background: #172554;
            color: white;
            padding: 25px;
        }

        main {
            padding: 70px 20px;
        }

        .card {
            max-width: 650px;
            margin: auto;
            padding: 35px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 5px 20px #00000012;
        }

        h2 {
            color: #2563eb;
        }

        .status {
            display: inline-block;
            background: #dcfce7;
            color: #166534;
            padding: 10px 16px;
            border-radius: 20px;
        }

        footer {
            margin-top: 50px;
            padding: 20px;
            background: #172554;
            color: white;
        }
    </style>
</head>
<body>
    <header>
        <h1>My AWS DevOps Project</h1>
        <p>GitHub + AWS EC2 + Nginx</p>
    </header>

    <main>
        <div class="card">
            <h2>Website Deployed Successfully!</h2>
            <p>My first website is running on an AWS EC2 Ubuntu server.</p>
            <p>Source Code: GitHub</p>
            <p>Web Server: Nginx</p>
            <p>Platform: AWS EC2</p>
            <span class="status">Deployment Successful</span>
        </div>
    </main>

    <footer>
        <p>My First DevOps Practical Project</p>
    </footer>
</body>
</html>
